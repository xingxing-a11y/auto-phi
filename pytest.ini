[pytest]
; 默认只收集 tests/。
; 不加这一段时，pytest 会连同 snapshots/ 下的历史归档一起收集：那里面存着
; 同名 test_*.py（如 snapshots/pre-ab-fix/tests/test_schedule.py），而 tests/ 没有
; __init__.py，pytest 按 basename 判模块身份 ⇒ 7 个 "import file mismatch" 收集错误。
testpaths = tests
; 归档、虚拟环境、临时脚本目录一律不递归。
norecursedirs = snapshots .venv .git tmp out __pycache__
