plugins {
    id 'com.android.application'
}

android {
    namespace 'io.pgauto.probe'
    compileSdk 34

    defaultConfig {
        applicationId "io.pgauto.probe"
        // 29 = Android 10 = AudioPlaybackCapture 起始版本，低于它没有 API 可用
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // 探针只要 debug 包：`adb install -r` 直接装，不用配签名
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
